name: Quality Gates

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: npm run verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic quality gates
        run: npm run verify
